services:
  # Frontend service (nginx serving static files with SSL support)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"  # Use port 8080 to avoid conflicts
      - "443:443"
    depends_on:
      - backend
    volumes:
      # SSL certificates
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
    restart: unless-stopped
    networks:
      - gmat-quiz-network

  # Certbot for SSL certificate management
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./ssl/certbot/conf:/etc/letsencrypt
      - ./ssl/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - gmat-quiz-network

  # Backend service (FastAPI on port 8000)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for SQLite and other files (better approach)
      - ./data:/app/data
      - ./user_databases:/app/user_databases
      - ./JSON:/app/JSON
      - ./images:/app/images
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - ALLOW_USER_REGISTRATION=${ALLOW_USER_REGISTRATION:-true}
      - DATABASE_URL=sqlite:///data/quiz.db  # Use data directory
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gmat-quiz-network

networks:
  gmat-quiz-network:
    driver: bridge
